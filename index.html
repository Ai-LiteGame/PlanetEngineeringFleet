<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17345c">
    <meta name="description" content="适合幼儿园大班儿童的工程车学习游戏，练习汉字、英语和数学思维。">
    <title>星球工程车队</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="app" aria-live="polite"></main>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" class="settings-content">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">家长与老师</p>
            <h2 id="settings-title">工程队设置</h2>
          </div>
          <button class="icon-button" value="close" aria-label="关闭设置">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <label class="switch-row">
          <span><strong>声音与朗读</strong><small>关闭后仍可通过文字完成游戏</small></span>
          <input id="sound-toggle" type="checkbox" role="switch" checked>
        </label>
        <div id="learning-summary" class="learning-summary"></div>
        <button id="reset-progress" type="button" class="text-button danger-button">重置学习记录</button>
      </form>
    </dialog>

    <noscript>请启用 JavaScript 后开始施工。</noscript>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
